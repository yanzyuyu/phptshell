<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 554" width="679" height="554">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 500; }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd-text { fill: #f0f6fc; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="679" height="554" rx="10" fill="url(#bg_grad)" stroke="#30363d" stroke-width="1.5" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="339.5" y="24" text-anchor="middle" class="title-text">anti-php2shell — host audit</text>
  <line x1="0" y1="38" x2="679" y2="38" stroke="#30363d" stroke-width="1" />
  <text x="24" y="56" class="terminal-text"><tspan class="prompt">$ </tspan><tspan class="cmd-text">python3 run.py scan</tspan></text>
  <text x="24" y="78" class="terminal-text"></text>
  <text x="24" y="98" class="terminal-text"><tspan fill="#79c0ff" font-weight="bold">┌──────────────────────────────────────────────────────────────────┐</tspan></text>
  <text x="24" y="118" class="terminal-text"><tspan fill="#79c0ff" font-weight="bold">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">anti-php2shell :: HOST SECURITY AUDIT</tspan></text>
  <text x="24" y="138" class="terminal-text"><tspan fill="#79c0ff" font-weight="bold">│</tspan><tspan>  </tspan><tspan fill="#8b949e">Evaluating PHP runtime, SAPIs, and upload_progress directives</tspan></text>
  <text x="24" y="158" class="terminal-text"><tspan fill="#79c0ff" font-weight="bold">└──────────────────────────────────────────────────────────────────┘</tspan></text>
  <text x="24" y="178" class="terminal-text"></text>
  <text x="24" y="198" class="terminal-text"><tspan fill="#8b949e">┌── RUNTIME DIAGNOSTICS ───────────────────────────────────────────┐</tspan></text>
  <text x="24" y="218" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">PHP Binary          </tspan><tspan> : </tspan><tspan fill="#79c0ff" font-weight="bold">/usr/bin/php</tspan></text>
  <text x="24" y="238" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">Detected Version    </tspan><tspan> : </tspan><tspan fill="#ff7b72" font-weight="bold">8.3.6</tspan></text>
  <text x="24" y="258" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">Active SAPI(s)      </tspan><tspan> : </tspan><tspan fill="#f0f6fc" font-weight="bold">None detected</tspan></text>
  <text x="24" y="278" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">Upload Progress     </tspan><tspan> : </tspan><tspan fill="#ff7b72" font-weight="bold">ENABLED (Dangerous)</tspan></text>
  <text x="24" y="298" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">Discovered INIs     </tspan><tspan> : </tspan><tspan fill="#f0f6fc" font-weight="bold">3</tspan></text>
  <text x="24" y="318" class="terminal-text"><tspan fill="#8b949e">│</tspan><tspan>  </tspan><tspan fill="#f0f6fc" font-weight="bold">Audit Status        </tspan><tspan> : </tspan><tspan fill="#ffffff" font-weight="bold" style="background-color:#b62324;"> HIGH RISK </tspan></text>
  <text x="24" y="338" class="terminal-text"><tspan fill="#8b949e">└──────────────────────────────────────────────────────────────────┘</tspan></text>
  <text x="24" y="358" class="terminal-text"></text>
  <text x="24" y="378" class="terminal-text"><tspan> </tspan><tspan fill="#f0f6fc" font-weight="bold">Discovered Configuration Targets:</tspan></text>
  <text x="24" y="398" class="terminal-text"><tspan>  </tspan><tspan fill="#8b949e">├─</tspan><tspan> </tspan><tspan fill="#79c0ff" font-weight="bold">/etc/php/8.3/apache2/php.ini</tspan></text>
  <text x="24" y="418" class="terminal-text"><tspan>  </tspan><tspan fill="#8b949e">├─</tspan><tspan> </tspan><tspan fill="#79c0ff" font-weight="bold">/etc/php/8.3/cli/php.ini</tspan></text>
  <text x="24" y="438" class="terminal-text"><tspan>  </tspan><tspan fill="#8b949e">└─</tspan><tspan> </tspan><tspan fill="#79c0ff" font-weight="bold">/etc/php/8.3/fpm/php.ini</tspan></text>
  <text x="24" y="458" class="terminal-text"></text>
  <text x="24" y="478" class="terminal-text"><tspan> </tspan><tspan fill="#f0f6fc" font-weight="bold">Recommendation:</tspan><tspan> PHP 8.3.6 vulnerable with session.upload_progress.enabled=1.</tspan></text>
  <text x="24" y="498" class="terminal-text"></text>
  <text x="24" y="518" class="terminal-text"></text>
</svg>
